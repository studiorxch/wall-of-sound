<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StudioRich Station</title>
<style>
  body { font: 16px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 2rem 1.5rem; background: #0e0d0b; color: #f4efe7; }
  #station-back-to-map { display: inline-block; margin-bottom: 1.5rem; color: #f4efe7; text-decoration: none; padding: 6px 12px; border: 1px solid rgba(255,255,255,.24); border-radius: 8px; font: 700 11px/1 inherit; letter-spacing: .07em; }
  #station-back-to-map:hover { border-color: rgba(255,255,255,.5); }
  .station-cover-name { font-size: 28px; margin: 0 0 .5rem; }
  .station-cover-routes { display: flex; gap: 8px; margin-bottom: .5rem; }
  .station-route-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; font: 700 14px/1 inherit; }
  .station-cover-location { color: #c8c0b6; font-size: 14px; margin: 0 0 1.5rem; }
  .station-cover-status { color: #c8c0b6; }
  .station-cover-creative-space { margin-top: .5rem; padding: 10px 18px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #c8c0b6; font: 700 12px/1 inherit; letter-spacing: .04em; cursor: not-allowed; }
</style>
</head>
<body>
  <a id="station-back-to-map" href="/wall-app/">&larr; MAP</a>
  <div id="station-cover-root"><p class="station-cover-status">Loading station…</p></div>
  <script type="module" src="/src/station/stationCoverRuntime.ts"></script>
</body>
</html>

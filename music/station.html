<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StudioRich Station</title>
<style>
  :root { color-scheme: dark; }
  body { font: 16px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 3rem 1.75rem 4rem; background: #0e0d0b; color: #f4efe7; max-width: 460px; box-sizing: border-box; }

  #station-back-to-map { display: inline-block; margin-bottom: 2.5rem; color: #a39a8d; text-decoration: none; padding: 6px 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; font: 700 11px/1 inherit; letter-spacing: .07em; transition: border-color .15s, color .15s; }
  #station-back-to-map:hover { border-color: rgba(255,255,255,.4); color: #f4efe7; }

  /* STATION-04 -- embedded mode: this exact page is reused, unmodified in
     substance, as the Mezzanine Drawer's content (see
     wall/systems/presentation/subwayMezzanineDrawer.js) -- MAP already
     supplies its own "back"/close affordance (deselecting the station), so
     the standalone page's own back-to-MAP link would be redundant and
     semantically wrong inside a panel MAP itself hosts. `max-width` is
     also dropped -- the surrounding drawer's own width (315-540px,
     user-resizable) is the real constraint here, not a fixed page width. */
  body.embedded { padding: 1.5rem 1.25rem 2rem; max-width: none; }
  body.embedded #station-back-to-map { display: none; }

  /* Fluid at narrow widths (drawer minimum: 315px) -- smaller gutters,
     never a horizontal scrollbar. */
  @media (max-width: 380px) {
    body { padding: 1.75rem 1.25rem 2.5rem; }
  }

  .station-cover-enter-platform { margin-top: 2rem; width: 100%; padding: 10px 18px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14); background: none; color: #a39a8d; font: 700 12px/1 inherit; letter-spacing: .05em; cursor: not-allowed; text-align: center; }

  .station-cover-name { font-size: 26px; font-weight: 600; margin: 0 0 .875rem; letter-spacing: -.01em; }

  /* STATION-02 -- circular outline "tinted glass" route badge. Border +
     glyph in the real route color, interior fill at ~10% opacity of the
     SAME color (tintBackground, derived not hardcoded) -- never a heavy
     solid bullet/pill. */
  .station-cover-routes { display: flex; gap: 10px; margin-bottom: 1.75rem; }
  .station-route-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px solid var(--route-color);
    background: var(--route-tint);
    color: var(--route-color);
    font: 700 15px/1 inherit;
  }

  .station-cover-location { color: #8a8177; font-size: 13px; margin: 0 0 2.5rem; letter-spacing: .02em; }
  .station-cover-status { color: #8a8177; }
  .station-cover-note { color: #6b6357; font-size: 12.5px; margin: .5rem 0 0; }

  /* STATION-02 -- restrained N/S control. Descriptive text, not a
     conventional button pair; active direction may borrow route color,
     inactive stays subdued. */
  .station-direction-control { display: flex; align-items: center; gap: 10px; margin: 0 0 1.25rem; }
  .station-direction-option {
    appearance: none; background: none; border: none; padding: 0; cursor: pointer;
    font: 700 11px/1 inherit; letter-spacing: .09em; color: #6b6357;
    transition: color .15s;
  }
  .station-direction-option:hover { color: #a39a8d; }
  .station-direction-option--active { color: #f4efe7; }
  .station-direction-sep { color: #3a352e; font-size: 11px; }

  .station-arrivals { margin-bottom: 2rem; }
  .station-arrival-row { display: flex; align-items: baseline; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .station-arrival-row:last-child { border-bottom: none; }
  .station-arrival-route { color: #c8c0b6; letter-spacing: .02em; }
  .station-arrival-eta { color: #f4efe7; font-weight: 600; }

  /* STATION-02 -- quiet-at-rest local line orientation. Dashes either
     side of a single current-station marker, no permanent station list. */
  .station-line-orientation { display: flex; align-items: center; gap: 10px; margin-bottom: .375rem; font-size: 12px; letter-spacing: .04em; }
  .station-line-mark--dim { color: #3a352e; flex: 1; text-align: center; }
  .station-line-mark--current { display: flex; align-items: center; gap: 6px; color: #f4efe7; font-weight: 700; white-space: nowrap; }
  .station-line-dot { width: 6px; height: 6px; border-radius: 50%; background: #f4efe7; display: inline-block; }
</style>
</head>
<body>
  <a id="station-back-to-map" href="/wall-app/">&larr; MAP</a>
  <div id="station-cover-root"><p class="station-cover-status">Loading station…</p></div>
  <script type="module" src="/src/station/stationCoverRuntime.ts"></script>
</body>
</html>

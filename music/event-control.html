<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudioRich Event Radio Control</title>
    <style>
      /**
       * Event Radio Turnkey Operations V1 -- the smallest useful operator
       * control this build's own brief asks for: choose an existing
       * published program, choose PERSONAL vs CLOCK, set a Clock start
       * time, set event status, Apply. NOT an admin dashboard -- no
       * program creation, no audio upload, no member management. Reuses
       * Blackbook's own restrained dark/translucent visual language
       * (island panels, same accent color) rather than inventing a new one.
       */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f4efe7; background: #050505; }
      body { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; }
      main { width: min(420px, 100%); }
      h1 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #c8c0b6; margin-bottom: 20px; }
      .island {
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 14px;
        background: rgba(14,13,11,.86);
        box-shadow: 0 12px 40px rgba(0,0,0,.4);
        backdrop-filter: blur(16px);
        padding: 20px;
      }
      #signed-out, #not-authorized { text-align: center; padding: 32px 20px; font-size: 12px; color: #c8c0b6; line-height: 1.6; }
      button { border: 1px solid rgba(255,255,255,.16); background: rgba(24,22,19,.92); color: #f4efe7; border-radius: 9px; padding: 9px 16px; font: 700 10px/1 inherit; letter-spacing: .07em; cursor: pointer; }
      button:hover { border-color: rgba(255,255,255,.32); }
      button:disabled { opacity: .4; cursor: default; }
      #apply { border-color: rgba(255, 78, 132, 0.72); color: #ff4e84; background: rgba(255, 78, 132, 0.14); width: 100%; padding: 12px; margin-top: 18px; font-size: 11px; }
      label { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: #928a80; margin: 16px 0 6px; }
      label:first-of-type { margin-top: 0; }
      select, input { width: 100%; border: 1px solid rgba(255,255,255,.16); background: rgba(24,22,19,.92); color: #f4efe7; border-radius: 8px; padding: 9px 10px; font: 600 11px/1 inherit; }
      .mode-row { display: flex; gap: 8px; }
      .mode-row button { flex: 1; }
      .mode-row button[aria-pressed="true"] { border-color: rgba(255, 78, 132, 0.72); color: #ff4e84; background: rgba(255, 78, 132, 0.14); }
      #status-row { display: flex; gap: 8px; }
      #status-row button { flex: 1; text-transform: uppercase; }
      #status-row button[aria-pressed="true"] { border-color: rgba(255, 78, 132, 0.72); color: #ff4e84; background: rgba(255, 78, 132, 0.14); }
      #clock-fields[hidden] { display: none; }
      #message { margin-top: 14px; font-size: 10px; letter-spacing: .03em; min-height: 14px; }
      #message[data-kind="error"] { color: #ff9a9a; }
      #message[data-kind="success"] { color: #9adfa0; }
      #current-state { font-size: 9px; color: #928a80; margin-top: 20px; line-height: 1.6; border-top: 1px solid rgba(255,255,255,.1); padding-top: 12px; }
      #sign-out { margin-top: 20px; width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <h1>StudioRich Event Radio Control</h1>

      <div id="signed-out" class="island">
        <p>Sign in as an authorized StudioRich operator to control the event program.</p>
        <button id="sign-in" style="margin-top:16px">Sign in with Google</button>
      </div>

      <div id="not-authorized" class="island" hidden>
        <p>Signed in, but this account is not an authorized event operator.</p>
        <button id="sign-out-unauthorized" style="margin-top:16px">Sign Out</button>
      </div>

      <div id="operator-form" class="island" hidden>
        <label for="program-select">Program</label>
        <select id="program-select"></select>

        <label>Mode</label>
        <div class="mode-row">
          <button id="mode-personal" aria-pressed="true">Personal</button>
          <button id="mode-clock" aria-pressed="false">Clock Radio</button>
        </div>

        <div id="clock-fields" hidden>
          <label for="start-input">Clock start time (your local time zone)</label>
          <input id="start-input" type="datetime-local" />
        </div>

        <label>Status</label>
        <div id="status-row">
          <button id="status-inactive" aria-pressed="true">Inactive</button>
          <button id="status-ready" aria-pressed="false">Ready</button>
          <button id="status-active" aria-pressed="false">Active</button>
        </div>

        <button id="apply">Apply</button>
        <div id="message" role="status"></div>

        <div id="current-state"></div>
        <button id="sign-out">Sign Out</button>
      </div>
    </main>
    <script type="module" src="/src/member/eventControlRuntime.ts"></script>
  </body>
</html>

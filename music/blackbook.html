<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudioRich Blackbook</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #090909; color: #f4efe7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #23201c, #090909 62%); }
      main { width: min(92vw, 780px); }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      h1 { margin: 0; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
      .actions { display: flex; gap: 8px; }
      .supplies { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
      .supplies label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #c8c0b6; }
      .supplies input { width: 110px; }
      /* Drawing Shell V1: same active-tool accent StudioRich already uses on
         the Map drawing controls (wall/styles.css's .subway-map-paint-controls
         button.is-active) -- same instrument panel, different cockpit. */
      button { border: 1px solid #575047; background: #171512; color: inherit; border-radius: 6px; padding: 9px 14px; font: 600 10px/1 inherit; letter-spacing: .08em; cursor: pointer; }
      button[aria-pressed="true"] { border-color: rgba(255, 78, 132, 0.72); color: #ff4e84; background: rgba(255, 78, 132, 0.12); }
      button:disabled { opacity: .38; cursor: default; }
      input[type="color"] { width: 26px; height: 22px; padding: 0; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 4px; background: transparent; }
      canvas { display: block; width: 100%; aspect-ratio: 4 / 5; background: #0f0d0b; border-radius: 5px; box-shadow: 0 20px 70px #000a; touch-action: none; }
      #blackbook-status { display: block; margin-top: 10px; color: #a9a197; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <header><h1>StudioRich Blackbook · Page 1</h1><div class="actions"><button id="blackbook-pan" aria-pressed="false">PAN</button><button id="blackbook-undo" disabled>UNDO</button><button id="blackbook-member">…</button></div></header>
      <div class="supplies" aria-label="Art Supplies"><button id="blackbook-pencil" aria-pressed="true">PENCIL</button><button id="blackbook-pen" aria-pressed="false">PEN</button><button id="blackbook-marker" aria-pressed="false">MARKER</button><button id="blackbook-mop" aria-pressed="false">MOP</button><button id="blackbook-spray" aria-pressed="false">SPRAY</button><button id="blackbook-eraser" aria-pressed="false">ERASER</button><label>COLOR <input id="blackbook-color" type="color"></label><label>WIDTH <input id="blackbook-width" type="range" min="1" max="48" step="1" value="5"></label><label>OPACITY <input id="blackbook-opacity" type="range" min="0.15" max="1" step="0.05" value="0.82"></label></div>
      <canvas id="blackbook-page" width="720" height="900" aria-label="Blackbook Page 1 drawing surface"></canvas>
      <small id="blackbook-status" aria-live="polite">Connecting…</small>
    </main>
    <script type="module" src="/src/member/blackbookRuntime.ts"></script>
  </body>
</html>

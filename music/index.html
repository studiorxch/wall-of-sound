<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUSIC</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Wall's real MAPS palette authority — the exact same files the live
         Broadcast runtime uses, reached through the /wall-app proxy
         (vite.config.ts server.proxy) so this origin and Wall's origin share
         one localStorage. Plain global scripts, not ES modules, loaded
         before the React bundle so window.SBE is populated first;
         music/src/maps/wallPaletteBridge.ts wraps window.SBE.MapsPaletteAuthority.
         Nothing here is a second map runtime or a second palette authority. -->
    <!-- AtmosphereComposite itself — mapsPaletteRegistry.js only discovers
         the runtime overlay toggle when window.SBE.AtmosphereComposite is
         present (see _discoverOverlays()). It defines functions only; it
         does nothing until this page's own overlay toggle calls init(). -->
    <script src="/wall-app/render/atmosphereComposite.js"></script>
    <script src="/wall-app/systems/presentation/mapsPaletteRegistry.js"></script>
    <script src="/wall-app/systems/presentation/mapsPaletteApplyAdapters.js"></script>
    <script src="/wall-app/systems/presentation/mapsPaletteSeeds.js"></script>
    <script src="/wall-app/systems/presentation/mapsPaletteAuthority.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAPS — Wall of Sound</title>
  <base href="/maps/" />
  <link rel="stylesheet" href="./mapsStyles.css" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
</head>
<body>
  <!-- ── DEPRECATED (0729_STUDIORICH_Centralized_Library_MAPS_Integration) —
       this standalone page is a frozen temporary proof and migration source.
       The MAPS palette interface now lives inside the centralized Library
       application (music/ dev server → top-nav "MAPS"), which reaches the
       same wall/ palette authority through the /wall-app same-origin proxy.
       Do not add product features here. Backend modules under
       wall/systems/presentation/ remain active and owned by wall/. ── -->
  <div class="maps-shell">
    <header class="maps-topbar">
      <div class="maps-brand">WOS</div>
      <nav class="maps-nav">
        <!-- MUSIC is a separate Vite dev server, not a static folder under this
             origin — a relative path here can never resolve. Points at its
             configured dev port (.claude/launch.json "music", port 5173,
             autoPort may shift it); opens in a new tab so a wrong guess never
             breaks the MAPS session. -->
        <a class="maps-nav-item" href="http://localhost:5173/" target="_blank" rel="noopener">MUSIC</a>
        <span class="maps-nav-item maps-nav-item--active">MAPS</span>
        <a class="maps-nav-item" href="../index.html">Broadcast</a>
      </nav>
    </header>

    <div class="maps-body">
      <aside class="maps-sidebar">
        <div class="maps-sidebar-group">
          <div class="maps-sidebar-label">MAPS</div>
          <a class="maps-sidebar-item maps-sidebar-item--active" href="#/palettes">Palettes</a>
        </div>
      </aside>

      <main class="maps-content" id="maps-content"><!-- populated by mapsShell.js --></main>
    </div>
  </div>

  <!-- ── Mapbox GL JS — one lightweight preview instance for palette thumbnails/detail ── -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <script src="../mapbox-env.js" onerror="console.warn('[MAPS] Mapbox token missing — copy wall/mapbox-env.template.js → wall/mapbox-env.js and fill token')"></script>

  <!-- ── Shared MAPS palette backend (same modules the live Broadcast map uses) ── -->
  <script src="../systems/presentation/mapsPaletteRegistry.js"></script>
  <script src="../systems/presentation/mapsPaletteApplyAdapters.js"></script>
  <script src="../systems/presentation/mapsPaletteSeeds.js"></script>
  <script src="../systems/presentation/mapsPaletteAuthority.js"></script>
  <script src="../systems/presentation/mapsPaletteAuthority.tests.js"></script>

  <!-- ── MAPS UI (built fresh — does not reuse studio/'s shell/CSS/components) ── -->
  <script src="./paletteDetail.js"></script>
  <script src="./palettesGallery.js"></script>
  <script src="./mapsShell.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudioRich - Spatial Spraypaint V0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d11;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e0e0e0;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    #viewport-container {
      position: relative;
      flex: 1;
      height: 100%;
      background: #050508;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #composite-canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }
    #controls-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 300px;
      padding: 16px;
      background: rgba(18, 18, 24, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .panel-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ff3366;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a0a0b0;
    }
    select, input[type="range"], button, input[type="file"] {
      width: 100%;
      background: #1a1a24;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
    }
    button {
      cursor: pointer;
      font-weight: 600;
      background: #2a2a3a;
    }
    button:hover {
      background: #3a3a4e;
      border-color: rgba(255, 255, 255, 0.3);
    }
    button.active {
      background: #ff3366;
      border-color: #ff3366;
      color: #fff;
    }
    .color-swatches {
      display: flex;
      gap: 6px;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s ease;
    }
    .swatch:hover {
      transform: scale(1.1);
    }
    .swatch.selected {
      border-color: #ffffff;
      transform: scale(1.15);
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05);
      color: #808090;
    }
    .status-badge.on {
      background: rgba(0, 255, 128, 0.2);
      color: #00ff80;
    }
    #debug-overlay {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      font-family: monospace;
      font-size: 11px;
      color: #00ff80;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
  <!-- CDN Scripts for MediaPipe Hand Tracking (Browser execution) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">
    <div id="viewport-container">
      <canvas id="composite-canvas"></canvas>
    </div>

    <div id="controls-panel">
      <div class="panel-title">Spatial Spraypaint V0</div>

      <div class="control-group">
        <label>Input Mode</label>
        <select id="input-mode">
          <option value="mouse">Mouse / Trackpad</option>
          <option value="spatial">Webcam Hand Tracking</option>
        </select>
      </div>

      <div class="control-group" id="webcam-controls" style="display: none;">
        <button id="toggle-webcam">Start Camera</button>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
          <span style="font-size: 11px; color: #a0a0b0;">Pinch Spray Trigger</span>
          <span id="spray-status" class="status-badge">OFF</span>
        </div>
      </div>

      <div class="control-group">
        <label>Anonymity Treatment</label>
        <select id="anonymity-mode">
          <option value="clean">Clean (Normal)</option>
          <option value="ghost">Ghost (Soft Blur)</option>
          <option value="pixel">Pixelated</option>
          <option value="silhouette">Silhouette</option>
          <option value="chromatic">Chromatic Split</option>
          <option value="hidden" selected>Hidden (Canvas Only)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Color</label>
        <div class="color-swatches">
          <div class="swatch selected" style="background: #ff2a5f;" data-color="#ff2a5f"></div>
          <div class="swatch" style="background: #00f0ff;" data-color="#00f0ff"></div>
          <div class="swatch" style="background: #ffe600;" data-color="#ffe600"></div>
          <div class="swatch" style="background: #00ff66;" data-color="#00ff66"></div>
          <div class="swatch" style="background: #a855f7;" data-color="#a855f7"></div>
          <div class="swatch" style="background: #ffffff;" data-color="#ffffff"></div>
        </div>
      </div>

      <div class="control-group">
        <label>Cap Radius / Width (<span id="radius-val">28</span>px)</label>
        <input type="range" id="brush-radius" min="8" max="72" value="28" />
      </div>

      <div class="control-group">
        <label>Audio Track</label>
        <input type="file" id="audio-file" accept="audio/*" />
        <div style="display: flex; gap: 6px; margin-top: 4px;">
          <button id="play-audio" disabled>Play</button>
          <button id="stop-audio" disabled>Stop</button>
        </div>
      </div>

      <div class="control-group">
        <button id="toggle-record" style="background: #cc1100; color: #fff;">Record Performance</button>
        <button id="clear-canvas">Clear Canvas</button>
      </div>
    </div>

    <div id="debug-overlay">Mode: Mouse | FPS: --</div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
